name: CI

# What the "Verifying a change" section of AGENTS.md asks for, run on every push and pull request:
# the type check, a clean build, the internal links of the built site, and the formula sheet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: node scripts/check-links.mjs
      - run: node scripts/check-formulas.mjs
